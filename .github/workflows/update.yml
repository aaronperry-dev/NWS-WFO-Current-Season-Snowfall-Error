# Keeps the season up to date and publishes the viewer to GitHub Pages.
#   * every 6 hours from October to May (NOHRSC publishes a new 6-h analysis every 6 hours): run the pipeline, commit changed state/data, deploy
#   * on a push that changes the viewer: deploy only (the data already in the repository)
#   * "Run workflow" in the Actions tab runs the pipeline on demand
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Update season data and deploy viewer

on:
  schedule:
    - cron: "47 1,7,13,19 * 10,11,12,1,2,3,4,5 *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/update.yml"]

permissions:
  contents: write      # commit the updated state and viewer data
  pages: write
  id-token: write

concurrency:
  group: season-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev || true
          pip install -r requirements.txt

      - name: Update the current season
        if: github.event_name != 'push'
        run: python pipeline/update_season.py --workdir work

      - name: Commit changed state and viewer data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state viewer/data results
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "Update season data ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase origin main && git push
          fi

      - name: Assemble the static site
        run: |
          mkdir _site
          cp viewer/index.html _site/
          cp -r viewer/assets viewer/vendor viewer/data viewer/basemap _site/
          touch _site/.nojekyll
          test -s _site/data/manifest.json && test -s _site/basemap/meta.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
