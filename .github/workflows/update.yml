# Keeps the season up to date and publishes the viewer to GitHub Pages.
#   * every day at about 18:17 UTC from October to May: run the pipeline (new NOHRSC analyses since the last run, and NDFD forecasts for events the archive now covers),
#     commit changed state/data, deploy. GitHub may start scheduled runs some minutes late.
#   * on a push that changes the viewer or the pipeline: run the same update, so new code and data always go out together
#   * "Run workflow" in the Actions tab runs the pipeline on demand
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Update season data and deploy viewer

on:
  schedule:
    - cron: "17 18 * 10,11,12,1,2,3,4,5 *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["viewer/**", "pipeline/**", ".github/workflows/update.yml"]

permissions:
  contents: write      # commit the updated state and viewer data
  pages: write
  id-token: write

concurrency:
  group: season-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev || true
          pip install -r requirements.txt

      - name: Update the current season
        run: python pipeline/update_season.py --workdir work

      - name: Commit changed state and viewer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state viewer/data results
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "Update season data ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase origin main && git push
          fi

      - name: Assemble the static site
        run: |
          mkdir _site
          cp viewer/index.html _site/
          sed -i "s/__V__/${GITHUB_SHA::10}-$(date -u +%Y%m%d%H%M)/g" _site/index.html      # new URL for the CSS and JS on every deploy, so browsers never keep an old copy
          cp -r viewer/assets viewer/vendor viewer/data viewer/basemap _site/
          touch _site/.nojekyll
          test -s _site/data/manifest.json && test -s _site/basemap/meta.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate job: if GitHub's artifact service has a hiccup, "Re-run failed jobs" repeats only this step, not the whole pipeline.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
